<div class="container-fluid my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Inventario de Ejemplares</h2>
    <button mat-flat-button color="primary" (click)="nuevo()">
      <mat-icon>add_to_photos</mat-icon> Nuevo Ejemplar
    </button>
  </div>

  @if (loading) {
    <div class="d-flex justify-content-center my-5">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  } @else {
    <div class="mat-elevation-z8 table-responsive">
      <table mat-table [dataSource]="dataSource" class="w-100">

        <ng-container matColumnDef="id_ejemplar">
          <th mat-header-cell *matHeaderCellDef> ID Ejemplar </th>
          <td mat-cell *matCellDef="let element"> {{ element.id_ejemplar }} </td>
        </ng-container>

        <ng-container matColumnDef="id_libro">
          <th mat-header-cell *matHeaderCellDef> ID Libro </th>
          <td mat-cell *matCellDef="let element"> {{ element.id_libro }} {{ element.libro_titulo ? '- ' + element.libro_titulo : '' }} </td>
        </ng-container>

        <ng-container matColumnDef="codigo_inventario">
          <th mat-header-cell *matHeaderCellDef> Código Inventario </th>
          <td mat-cell *matCellDef="let element"> <code>{{ element.codigo_inventario }}</code> </td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef> Estado </th>
          <td mat-cell *matCellDef="let element">
            <span class="badge" [ngClass]="{
              'text-bg-success': element.estado === 'Disponible',
              'text-bg-warning': element.estado === 'Prestado',
              'text-bg-danger': element.estado === 'Mantenimiento'
            }">{{ element.estado }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="text-center"> Acciones </th>
          <td mat-cell *matCellDef="let element" class="text-center">
            <button mat-icon-button color="primary" (click)="editar(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminar(element)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  }
</div>
