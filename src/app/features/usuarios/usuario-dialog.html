<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo Usuario' : 'Editar Usuario' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="grid grid-cols-2 gap-4 pt-2">
    
    <mat-form-field appearance="outline">
      <mat-label>Nombre Completo</mat-label>
      <input matInput formControlName="nombre_completo" placeholder="Ej. Alejandra Carmona">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Correo Electrónico</mat-label>
      <input matInput formControlName="email" placeholder="ejemplo@correo.com">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Rol del Sistema</mat-label>
      <mat-select formControlName="rol">
        <mat-option value="Admin">Admin</mat-option>
        <mat-option value="Lector">Lector</mat-option>
        <mat-option value="Bibliotecario">Bibliotecario</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Estado de Cuenta</mat-label>
      <mat-select formControlName="activo">
        <mat-option [value]="true">Activo</mat-option>
        <mat-option [value]="false">Inactivo</mat-option>
      </mat-select>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">Guardar</button>
</mat-dialog-actions>
