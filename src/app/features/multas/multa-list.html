<div class="header-container">
  <h2>Gestión de Multas</h2>
  <button mat-flat-button color="primary" (click)="nuevo()">
    <mat-icon>add</mat-icon>
    Nueva Multa
  </button>
</div>

<div class="table-container mat-elevation-z8">
  @if (loading) {
    <div class="loading-shade">
      <mat-spinner></mat-spinner>
    </div>
  }

  <table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="id_multa">
      <th mat-header-cell *matHeaderCellDef>ID Multa</th>
      <td mat-cell *matCellDef="let row">{{ row.id_multa | slice:0:8 }}...</td>
    </ng-container>

    <ng-container matColumnDef="id_prestamo">
      <th mat-header-cell *matHeaderCellDef>ID Préstamo</th>
      <td mat-cell *matCellDef="let row">{{ row.id_prestamo | slice:0:8 }}...</td>
    </ng-container>

    <ng-container matColumnDef="valor_multa">
      <th mat-header-cell *matHeaderCellDef>Valor</th>
      <td mat-cell *matCellDef="let row">${{ row.valor_multa | number }}</td>
    </ng-container>

    <ng-container matColumnDef="fecha_creacion">
      <th mat-header-cell *matHeaderCellDef>Fecha Creación</th>
      <td mat-cell *matCellDef="let row">{{ row.fecha_creacion | date:'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="estado_pago">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let row">
        <span class="badge" [class.pagado]="row.estado_pago" [class.pendiente]="!row.estado_pago">
          {{ row.estado_pago ? 'Pagado' : 'Pendiente' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef class="actions-header">Acciones</th>
      <td mat-cell *matCellDef="let row" class="actions-cell">
        <button mat-icon-button color="accent" (click)="editar(row)" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminar(row)" matTooltip="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
