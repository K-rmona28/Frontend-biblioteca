<div style="padding: 20px; font-family: 'Segoe UI', Roboto, sans-serif;">
  <h2 style="color: #3f51b5; margin-top: 0;">Gestión de Libros</h2>
  <p style="color: #666; font-size: 14px;">Complete la información del ejemplar:</p>

  <form [formGroup]="form" style="display: flex; flex-direction: column; gap: 15px;">
    
    <div style="display: flex; flex-direction: column;">
      <label style="font-weight: bold; margin-bottom: 5px; color: #444;">Título del Libro</label>
      <input matInput formControlName="titulo" placeholder="Ej: Cien años de soledad" 
             style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; display: flex; flex-direction: column;">
        <label style="font-weight: bold; margin-bottom: 5px; color: #444;">Autor</label>
        <input matInput formControlName="autor" placeholder="Nombre del autor"
               style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      </div>
      <div style="flex: 1; display: flex; flex-direction: column;">
        <label style="font-weight: bold; margin-bottom: 5px; color: #444;">ISBN</label>
        <input matInput formControlName="isbn" placeholder="978-..."
               style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      </div>
    </div>

    <div style="display: flex; flex-direction: column;">
      <label style="font-weight: bold; margin-bottom: 5px; color: #444;">Editorial</label>
      <select formControlName="id_editorial" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: white;">
        @for (ed of editoriales; track ed.id_editorial) {
          <option [value]="ed.id_editorial">{{ ed.nombre }}</option>
        }
      </select>
    </div>

    <div style="display: flex; flex-direction: column;">
      <label style="font-weight: bold; margin-bottom: 5px; color: #444;">Categoría</label>
      <select formControlName="id_categoria" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: white;">
        @for (cat of categorias; track cat.id_categoria) {
          <option [value]="cat.id_categoria">{{ cat.nombre }}</option>
        }
      </select>
    </div>
  </form>

  <div style="margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px;">
    <button mat-button (click)="cancel()" style="padding: 10px 20px; cursor: pointer;">CANCELAR</button>
    <button (click)="save()" 
            [disabled]="form.invalid"
            style="padding: 10px 25px; background-color: #3f51b5; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      {{ loadingData ? 'GUARDANDO...' : 'GUARDAR LIBRO' }}
    </button>
  </div>
</div>
