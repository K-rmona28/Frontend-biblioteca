<div class="header-container">
  <h2>Catálogo de Libros</h2>
  <button mat-flat-button color="primary" (click)="nuevo()">
    <mat-icon>add</mat-icon>
    Nuevo Libro
  </button>
</div>

<div class="table-container mat-elevation-z8">
  @if (loading) {
    <div class="loading-shade">
      <mat-spinner></mat-spinner>
    </div>
  }

  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="id_libro">
      <th mat-header-cell *matHeaderCellDef>ID Libro</th>
      <td mat-cell *matCellDef="let row">{{ row.id_libro | slice:0:8 }}...</td>
    </ng-container>

    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef>Título</th>
      <td mat-cell *matCellDef="let row"><strong>{{ row.titulo }}</strong></td>
    </ng-container>

    <ng-container matColumnDef="isbn">
      <th mat-header-cell *matHeaderCellDef>ISBN</th>
      <td mat-cell *matCellDef="let row">{{ row.isbn }}</td>
    </ng-container>

    <ng-container matColumnDef="anio_publicacion">
      <th mat-header-cell *matHeaderCellDef>Año de Publicación</th>
      <td mat-cell *matCellDef="let row">{{ row.anio_publicacion || 'N/A' }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef class="actions-header">Acciones</th>
      <td mat-cell *matCellDef="let row" class="actions-cell">
        <button mat-icon-button color="accent" (click)="editar(row)" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminar(row)" matTooltip="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
