<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Registrar Nuevo Autor' : 'Modificar Autor' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" style="display: flex; flex-direction: column; gap: 16px; padding-top: 10px;">
    
    <mat-form-field appearance="outline">
      <mat-label>Nombre del Autor</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej. Gabriel García Márquez">
      @if (form.controls.nombre.hasError('required')) {
        <mat-error>El nombre es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nacionalidad</mat-label>
      <input matInput formControlName="nacionalidad" placeholder="Ej. Colombiana">
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="save()">
    {{ data.mode === 'create' ? 'Guardar' : 'Actualizar' }}
  </button>
</mat-dialog-actions>
