<div class="container-fluid my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Relación Libros y Autores</h2>
    <button mat-flat-button color="primary" (click)="nuevo()">
      <mat-icon>link</mat-icon> Asociar Autor a Libro
    </button>
  </div>

  @if (loading) {
    <div class="d-flex justify-content-center my-5">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  } @else {
    <div class="mat-elevation-z8 table-responsive">
      <table mat-table [dataSource]="dataSource" class="w-100">

        <ng-container matColumnDef="id_libro_autor">
          <th mat-header-cell *matHeaderCellDef> ID Relación </th>
          <td mat-cell *matCellDef="let element"> {{ element.id_libro_autor }} </td>
        </ng-container>

        <ng-container matColumnDef="id_libro">
          <th mat-header-cell *matHeaderCellDef> ID Libro </th>
          <td mat-cell *matCellDef="let element"> {{ element.id_libro }} </td>
        </ng-container>

        <ng-container matColumnDef="id_autor">
          <th mat-header-cell *matHeaderCellDef> ID Autor </th>
          <td mat-cell *matCellDef="let element"> {{ element.id_autor }} </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="text-center"> Acciones </th>
          <td mat-cell *matCellDef="let element" class="text-center">
            <button mat-icon-button color="primary" (click)="editar(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminar(element)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  }
</div>
